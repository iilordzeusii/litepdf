[package]
name = "litepdf"
version = "0.1.0"
edition = "2021"
[dependencies]
egui = "0.34"
raw-window-handle = "0.6"
eframe = { version = "0.34", default-features = false, features = ["glow","default_fonts"] }
mupdf = "0.8.0"
jpeg-encoder = "0.6"
serde_json = "1"
underskrift = { version = "0.1.4", default-features = false, features = ["blocking"] }
lopdf = "0.39"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std","load-dynamic","directml","ndarray"] }
tokio = { version = "1", features = ["rt"] }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

windows = { version = "0.62", features = ["Win32_Foundation","Win32_System_Com","Win32_UI_Input_Pointer","Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_Graphics_DirectManipulation","Win32_Graphics_Gdi","Win32_UI_HiDpi","Win32_System_ProcessStatus","Win32_System_Threading"] }
windows-core = "0.62"

[patch.crates-io]
mupdf = { path = "vendor/mupdf" }
